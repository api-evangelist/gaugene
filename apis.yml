description: Gaugene (Beijing Zhizhen Biotechnology Co., Ltd. / 知真生物), founded in 2017 and headquartered
  in Beijing, China, develops and supplies flow cytometry instruments and reagents for the in-vitro
  diagnostics and life-sciences research market. Its analyzers use high-power lasers and high-sensitivity
  multi-color fluorescence detection for clinical hematology diagnosis, single-cell analysis, protein
  screening, and clinical-indicator discovery. Gaugene is a venture-backed diagnostics-hardware and
  reagents maker rather than an API provider; as of this enrichment pass it publishes no reachable public
  developer portal, API documentation, or machine-readable API surface (its apex domain does not resolve
  and www.gaugene.com returns a 502). It was added to the API Evangelist network as a portfolio-lead stub
  via Qiming Venture Partners.
